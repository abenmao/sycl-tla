name: Xe4 Workloads PR Test
on:
  push:
    branches: [ "master_next" ]
  pull_request:
    branches: [ "master_next" ]
  merge_group:
    branches: [ "master_next" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  xe4_workloads_test:
    name: Xe4 Workloads PR Test
    runs-on: [self-hosted, linux, xe4_sim]
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Xe4 Toolkit version
        shell: bash
        run: |
          echo "Xe4 Toolkit Version:"
          cat ~/xe4_toolkit/versions.txt

      - name: Start Xe4 Simulator
        shell: bash
        run: |
          cd ~/xe4_toolkit/xe4_simulator/
          # Start simulator in a loop that restarts on successful exit
          (
            while true; do
              echo "Starting Xe4 Simulator at $(date)"
              ./AubLoad -device :config/fleur_de_lis/devices/xe4hpc.1tx1x1x4x4.a0.map.xml \
              -socket tcp:4321 -attr EU.XESIM 3 -sim_mode perf_mpu \
              -cb_cfg multithread_mode affinity max_worker_threads 10 \
              -cb_cfg hang_detect_enable true hang_activation_threshold 1500 \
              hang_threshold 50 hang_analysis_period 1000000 hang_max_hang_cycles 250 \
              -enableDcGpgpuPrintMessage -enableFeature gpuCapabilityStructure \
              -disableFeature 14019930466 \
              -enableFeature 14024886170 \
              -enableFeature 14023456409 \
              -enableFeature 14022148216 \
              -enableFeature 14021142441 \
              -disableFeature 14024592460 \
              -disableFeature 14023522245 \
              -disableFeature 14025930643 \
              -enableFeature 16029053229 \
              -enableFeature 14024709425
              EXIT_CODE=$?
              echo "Xe4 Simulator exited with code $EXIT_CODE at $(date)"
              if [ $EXIT_CODE -ne 0 ]; then
                echo "Simulator exited with error, stopping loop"
                break
              fi
              echo "Restarting simulator in 2 seconds..."
              sleep 2
            done
          ) &
          echo $! > /tmp/xe4_simulator.pid
          echo "Xe4 Simulator loop started with PID: $(cat /tmp/xe4_simulator.pid)"
          # Give simulator time to start
          sleep 5

      - name: Build Xe4 workloads
        shell: bash
        run: |
          cat ~/xe4_toolkit/source_oneapi_env.sh
          source ~/xe4_toolkit/source_oneapi_env.sh
          mkdir -p build && cd build
          cmake .. -G Ninja \
          -DCUTLASS_ENABLE_SYCL=ON \
          -DCUTLASS_ENABLE_BENCHMARKS=OFF \
          -DCUTLASS_ENABLE_GTEST_UNIT_TESTS=ON \
          -DDPCPP_SYCL_TARGET=intel_gpu_jgs \
          -DCMAKE_CXX_COMPILER=${CXX} \
          -DCMAKE_C_COMPILER=${CC} \
          -DCUTLASS_SYCL_RUNNING_CI=ON

      - name: Run Xe4 Workloads
        working-directory: build
        shell: bash
        run: |
          source ~/xe4_toolkit/source_oneapi_env.sh
          source ~/xe4_toolkit/source_simulator_env.sh
          echo "--------------------------------------"
          echo "Running Xe4 GEMM Workload"
          ninja xe4_gemm
          ./examples/xe4/gemm/xe4_gemm
          echo "--------------------------------------"
          echo "Running Xe4 GEMM Cluster Workload"
          ninja xe4_gemm_cluster
          ./examples/xe4/gemm/xe4_gemm_cluster
          echo "--------------------------------------"
          echo "Running Xe4 GEMM Dynamic Workload"
          ninja xe4_gemm_dynamic
          ./examples/xe4/gemm/xe4_gemm_dynamic
          echo "--------------------------------------"
          echo "Running Xe4 GEMM Cluster Dynamic Workload"
          ninja xe4_gemm_cluster_dynamic
          ./examples/xe4/gemm/xe4_gemm_cluster_dynamic
          echo "--------------------------------------"
          echo "Running Xe4 GEMM Block-Scaled FP4/FP8 Workload"
          ninja xe4_gemm_blockscaled
          ./examples/xe4/gemm/xe4_gemm_blockscaled
          echo "--------------------------------------"
          echo "Running Xe4 GEMM Block-Scaled Cluster Workload"
          ninja xe4_gemm_blockscaled_cluster
          ./examples/xe4/gemm/xe4_gemm_blockscaled_cluster
          echo "--------------------------------------"
          echo "Running Xe4 CuTe AMMA w/o DMA GEMM Tutorial Workload"
          ninja xe4_amma
          ./examples/cute/tutorial/xe4/xe4_amma
          echo "--------------------------------------"
          echo "Running Xe4 CuTe AMMA+DMA GEMM Tutorial Workload"
          ninja xe4_amma_adma
          ./examples/cute/tutorial/xe4/xe4_amma_adma
          echo "--------------------------------------"
          echo "Running Xe4 CuTe AMMA+DMA GEMM Cluster Tutorial Workload"
          ninja xe4_amma_adma_cluster
          ./examples/cute/tutorial/xe4/xe4_amma_adma_cluster
          echo "--------------------------------------"
          echo "Running Xe4 CuTe AMMA+DMA Blockscale GEMM Tutorial Workload"
          ninja xe4_amma_adma_blockscaled_gemm
          ./examples/cute/tutorial/xe4/xe4_amma_adma_blockscaled_gemm
          echo "--------------------------------------"
          echo "Running Xe4 CuTe AMMA+DMA Blockscale GEMM Cluster Tutorial Workload"
          ninja xe4_amma_adma_blockscaled_gemm_cluster
          ./examples/cute/tutorial/xe4/xe4_amma_adma_blockscaled_gemm_cluster
          echo "--------------------------------------"
          echo "Running Xe4 CuTe FMHA3 Workload"
          ninja xe4_fmha_fwd
          ./examples/xe4/fmha3/xe4_fmha_fwd
          echo "--------------------------------------"
          echo "Running Xe4 CuTe FMHA4 Workload"
          ninja xe4_fmha4_fwd
          ./examples/xe4/fmha4/xe4_fmha4_fwd --batch=2 --num_heads=1 --seq_len_qo=1024 --seq_len_kv=1024 --head_size_vo=128 --head_size_qk=128
      
      - name: Run Xe4 UTs 
        working-directory: build
        shell: bash
        run: |
          source ~/xe4_toolkit/source_oneapi_env.sh
          source ~/xe4_toolkit/source_simulator_env.sh
          echo "Running Xe4 UTs"
          ninja cutlass_test_unit_cute_xe4
          ./test/unit/cute/xe4/cutlass_test_unit_cute_xe4_reduce_exp
          ./test/unit/cute/xe4/cutlass_test_unit_cute_xe4_adma_load_store
          
      - name: Stop Xe4 Simulator
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          # Stop the Xe4 simulator first
          if [ -f /tmp/xe4_simulator.pid ]; then
            PID=$(cat /tmp/xe4_simulator.pid)
            echo "Stopping Xe4 Simulator (PID: $PID)"
            # Kill the loop process and all its children
            pkill -P $PID || true
            kill $PID || true
            rm /tmp/xe4_simulator.pid
            echo "Xe4 Simulator stopped"
          else
            echo "No simulator PID file found"
          fi

      - name: Clean up
        if: always()
        continue-on-error: true
        run: |
          pwd
          git clean -xdf
          git submodule foreach --recursive git clean -xdf
