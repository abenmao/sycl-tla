name: "Full Coverage with Small Shapes Test"

on:
  push:
    branches: [ "cri","cri_pathfinding","v0.1.0_next" ]
  pull_request:
    branches: [ "cri","cri_pathfinding","v0.1.0_next" ]
  merge_group:
    branches: [ "cri","cri_pathfinding","v0.1.0_next" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Small-shape (BMG-only) builds are offloaded to build server #2 "Atlas"
  # (384 threads / ~1.5 TB RAM). The big-shape workflow offloads to build
  # server #1 "Hermes"; splitting the two shapes across two servers
  # load-balances the CI compile traffic.
  # TODO: add PVC offload here.
  BUILD_SERVER_NAME: "Atlas"            # build server #2 (small-shape builds)
  # Atlas's DNS FQDN (its own `hostname -f`, a MAC-derived DDNS name) instead of
  # a raw IP, so it keeps resolving if Atlas's DHCP lease/IP changes. The short
  # name "gnr630188" is only a local ssh-config alias and does NOT resolve in DNS.
  BUILD_SERVER: "a4bf018cf32e.jf.intel.com"
  BUILD_SERVER_USER: "gta"
  # Per-build memory budget on the build server. Remote compile parallelism
  # (global -j = budget/5, heavy flash-attention pool = budget/10) and the
  # admission gate's free-memory threshold are all derived from this one value.
  BUILD_MEM_BUDGET_GB: "256"
  SSH_OPTS: "-o ConnectTimeout=30 -o BatchMode=yes -o StrictHostKeyChecking=accept-new"
  REMOTE_CPU_THRESHOLD: "32"
  REMOTE_RAM_THRESHOLD: "128"
  # Remote build step timeout (min) + orphan-reap grace margin. Both the
  # build-step timeout and the orphan-reap age derive from these, staying in
  # sync. A clean compile takes ~30 min; 90 is ~3x headroom for contention.
  # Reap age = timeout + grace = 105 min.
  BUILD_STEP_TIMEOUT_MIN: "90"
  ORPHAN_REAP_GRACE_MIN: "15"

jobs:
  run-tests:
    strategy:
      matrix:
        include:
          - compiler: RELEASE
            gpu: BMG
            intel_graphics: ROLLING
            sycl_target: intel_gpu_bmg_g21
            runner: [self-hosted, shanghai-bmg, Linux, X64]

    name: Full Coverage with Small Shapes Test on ${{ matrix.gpu }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      # ---- Auto-detect build strategy based on runner hardware ----
      - name: Detect Build Strategy
        id: build-strategy
        shell: bash
        run: |
          CPU_THREADS=$(nproc)
          RAM_GB=$(awk '/MemTotal/{print int($2/1024/1024)}' /proc/meminfo)
          echo "Runner: ${CPU_THREADS} threads, ${RAM_GB} GB RAM"
          echo "Thresholds: >= ${REMOTE_CPU_THRESHOLD} threads AND >= ${REMOTE_RAM_THRESHOLD} GB RAM for local build"
          # Both conditions must be met to build locally; otherwise offload to
          # the dedicated build server. This catches machines with enough cores
          # but insufficient RAM (e.g. DUT1020PVC: 48 threads, 61 GB).
          if [ "${CPU_THREADS}" -ge "${REMOTE_CPU_THRESHOLD}" ] && \
             [ "${RAM_GB}" -ge "${REMOTE_RAM_THRESHOLD}" ]; then
            echo "use_remote=false" >> $GITHUB_OUTPUT
            echo "Strategy: LOCAL build (${CPU_THREADS} threads >= ${REMOTE_CPU_THRESHOLD}, ${RAM_GB} GB >= ${REMOTE_RAM_THRESHOLD})"
          else
            echo "use_remote=true" >> $GITHUB_OUTPUT
            echo "Strategy: REMOTE build (${CPU_THREADS} threads / ${RAM_GB} GB below threshold)"
          fi

      # ---- Admission gate ----
      # Before offloading, wait until Atlas has at least BUILD_MEM_BUDGET_GB of
      # memory free (up to 3 checks, 15 min apart) so we don't oversubscribe it.
      # If it never frees up, skip the remote build and fall back to a local build.
      - name: Wait for Build Server Capacity
        id: admission
        if: steps.build-strategy.outputs.use_remote == 'true'
        timeout-minutes: 40
        shell: bash
        run: |
          GATE_GB=${BUILD_MEM_BUDGET_GB}
          CHECKS=3
          INTERVAL_MIN=15
          admitted=false
          for i in $(seq 1 $CHECKS); do
            FREE_GB=$(ssh ${SSH_OPTS} ${BUILD_SERVER_USER}@${BUILD_SERVER} \
              "awk '/MemAvailable/{print int(\$2/1048576)}' /proc/meminfo" 2>/dev/null || echo 0)
            echo "Capacity check ${i}/${CHECKS}: ${BUILD_SERVER_NAME} (${BUILD_SERVER}) MemAvailable=${FREE_GB}GB (gate ${GATE_GB}GB)"
            if [ "${FREE_GB:-0}" -ge "$GATE_GB" ]; then
              admitted=true
              break
            fi
            if [ "$i" -lt "$CHECKS" ]; then
              echo "Below gate; waiting ${INTERVAL_MIN}min before recheck..."
              sleep $((INTERVAL_MIN * 60))
            fi
          done
          echo "admitted=${admitted}" >> $GITHUB_OUTPUT
          if [ "$admitted" != "true" ]; then
            echo "::warning::Build server capacity gate (${GATE_GB}GB) not met after ${CHECKS} checks; falling back to local build."
          fi

      - name: Remote Build
        id: remote-build
        if: steps.build-strategy.outputs.use_remote == 'true' && steps.admission.outputs.admitted == 'true'
        continue-on-error: true
        timeout-minutes: ${{ fromJSON(env.BUILD_STEP_TIMEOUT_MIN) }}
        shell: bash
        run: |
          BUILD_ID="${{ github.run_id }}-small-${{ runner.name }}-${{ github.run_attempt }}"
          echo "BUILD_ID=${BUILD_ID}" >> $GITHUB_ENV

          # Detect the runner's compiler version for ABI compatibility
          RUNNER_ICPX_VER=$(/opt/intel/oneapi/compiler/latest/bin/icpx --version | head -1)
          echo "Runner compiler: ${RUNNER_ICPX_VER}"

          # --- Infrastructure checks (failure here → allow fallback) ---

          # Layer 1: Quick connectivity check (30s timeout)
          if ! ssh ${SSH_OPTS} \
            ${BUILD_SERVER_USER}@${BUILD_SERVER} "timeout 30 docker info > /dev/null 2>&1"; then
            echo "::warning::Build server unreachable or Docker not available."
            echo "failure_type=infra" >> $GITHUB_OUTPUT
            exit 1
          fi

          # Startup sweep: reap orphaned build containers from earlier
          # cancelled/timed-out runs (docker run is parented by dockerd, so a
          # cancelled run can leave the container alive). Only this layer reaps
          # *other* runs' orphans; the trap and always() cleanup touch only this
          # run. Best-effort. Reap age = BUILD_STEP_TIMEOUT_MIN +
          # ORPHAN_REAP_GRACE_MIN (105 min) -- just above the step timeout, so any
          # container that old is guaranteed orphaned.
          REAP_AGE_S=$(( (BUILD_STEP_TIMEOUT_MIN + ORPHAN_REAP_GRACE_MIN) * 60 ))
          ssh ${SSH_OPTS} ${BUILD_SERVER_USER}@${BUILD_SERVER} '
            now=$(date +%s)
            for cid in $(docker ps -q --filter "name=cutlass-build-"); do
              started=$(docker inspect -f "{{.State.StartedAt}}" "$cid" 2>/dev/null)
              [ -z "$started" ] && continue
              # If StartedAt cannot be parsed, fall back to "now" (age 0) so the
              # container is KEPT, not reaped -- never docker rm -f a container we
              # cannot prove is old. A leaked orphan is caught later (24h cleanup);
              # wrongly reaping a live build would break a legitimate run.
              started_s=$(date -d "$started" +%s 2>/dev/null || echo "$now")
              if [ $(( now - started_s )) -gt '"${REAP_AGE_S}"' ]; then
                name=$(docker inspect -f "{{.Name}}" "$cid" 2>/dev/null)
                echo "Reaping orphan build container ${name#/} (age $(( now - started_s ))s)"
                docker rm -f "$cid" >/dev/null 2>&1 || true
              fi
            done
          ' || true

          # Find a oneAPI installation on build server with matching compiler version
          ONEAPI_REAL_PATH=$(readlink -f /opt/intel/oneapi)
          if ! MATCH=$(ssh ${SSH_OPTS} ${BUILD_SERVER_USER}@${BUILD_SERVER} "
            # First try the same path as runner
            if [ -d '${ONEAPI_REAL_PATH}' ] && \
               '${ONEAPI_REAL_PATH}/compiler/latest/bin/icpx' --version 2>/dev/null | head -1 | grep -qF '${RUNNER_ICPX_VER}'; then
              echo '${ONEAPI_REAL_PATH}'
            else
              # Search all installed versions
              for d in /opt/intel/oneapi-pytorch/*/; do
                if [ -x \"\${d}compiler/latest/bin/icpx\" ] && \
                   \"\${d}compiler/latest/bin/icpx\" --version 2>/dev/null | head -1 | grep -qF '${RUNNER_ICPX_VER}'; then
                  echo \"\${d%/}\"
                  break
                fi
              done
            fi
          "); then
            echo "::warning::SSH failed during compiler version check."
            echo "failure_type=infra" >> $GITHUB_OUTPUT
            exit 1
          fi

          if [ -n "${MATCH}" ]; then
            ONEAPI_REAL_PATH="${MATCH}"
            echo "Build server matching oneAPI found at: ${ONEAPI_REAL_PATH}"
          else
            echo "::warning::Build server has no oneAPI matching '${RUNNER_ICPX_VER}'. Falling back to local build."
            echo "failure_type=infra" >> $GITHUB_OUTPUT
            exit 1
          fi

          # Cleanup build artifacts older than 24 hours (by creation time, falling back to mtime)
          # Only deletes directories matching our BUILD_ID pattern (runid-common/small-runner-attempt)
          ssh ${SSH_OPTS} ${BUILD_SERVER_USER}@${BUILD_SERVER} "
            cutoff=\$(date -d '24 hours ago' +%s)
            for d in /home/${BUILD_SERVER_USER}/ci-builds/*/ /shared/builds/*/; do
              [ -d \"\$d\" ] || continue
              bname=\$(basename \"\$d\")
              [[ \"\$bname\" =~ ^[0-9]+-(common|small)-.+-[0-9]+$ ]] || continue
              created=\$(stat -c %W \"\$d\" 2>/dev/null || echo 0)
              if [ \"\$created\" -le 0 ]; then
                created=\$(stat -c %Y \"\$d\" 2>/dev/null || echo 0)
              fi
              if [ \"\$created\" -gt 0 ] && [ \"\$created\" -lt \"\$cutoff\" ]; then
                sudo -n rm -rf \"\$d\"
              fi
            done
          " || true

          # Layer 2: Full remote build (protected by the BUILD_STEP_TIMEOUT_MIN step timeout)
          # On re-run (attempt > 1), clean previous attempt's leftover dirs.
          # Docker may leave root-owned artifacts that rsync cannot overwrite.
          PREV_ATTEMPT_BUILD_ID="${{ github.run_id }}-small-${{ runner.name }}-$(( ${{ github.run_attempt }} - 1 ))"
          if ! ssh ${SSH_OPTS} ${BUILD_SERVER_USER}@${BUILD_SERVER} "
            sudo -n rm -rf /home/${BUILD_SERVER_USER}/ci-builds/${PREV_ATTEMPT_BUILD_ID} /shared/builds/${PREV_ATTEMPT_BUILD_ID};
            mkdir -p /home/${BUILD_SERVER_USER}/ci-builds/${BUILD_ID}/source
          "; then
            echo "::warning::Failed to prepare remote build directory."
            echo "failure_type=infra" >> $GITHUB_OUTPUT
            exit 1
          fi

          if ! rsync -a --delete --exclude='.git' -e "ssh ${SSH_OPTS}" \
            ${{ github.workspace }}/ \
            ${BUILD_SERVER_USER}@${BUILD_SERVER}:/home/${BUILD_SERVER_USER}/ci-builds/${BUILD_ID}/source/; then
            echo "::warning::Failed to sync source to build server."
            echo "failure_type=infra" >> $GITHUB_OUTPUT
            exit 1
          fi

          # --- Compilation (EXIT_COMPILE_ERROR=42 from build.sh = code error → no fallback) ---

          # Name the container so it can be force-removed if this step is cancelled
          # or times out. The docker run is launched over SSH, so its real parent is
          # dockerd on the build server — not this SSH client. Without an explicit
          # kill, cancelling the run orphans the container, which keeps compiling and
          # consuming RAM. This trap is a best-effort kill within the cancel grace
          # period; the startup sweep and always() cleanup are the other two layers.
          CONTAINER_NAME="cutlass-build-${BUILD_ID}"
          kill_remote_container() {
            ssh ${SSH_OPTS} ${BUILD_SERVER_USER}@${BUILD_SERVER} \
              "docker rm -f ${CONTAINER_NAME} >/dev/null 2>&1" || true
          }
          trap kill_remote_container EXIT INT TERM

          # Build parallelism from the memory budget (~5 GiB per average TU):
          #   global -j   = budget / 5
          #   heavy FA -j = budget / 10   (FA TUs peak ~2x; allow half as many)
          # The heavy pool only throttles FA compiles; other targets leave it idle.
          NINJA_J=$(( BUILD_MEM_BUDGET_GB / 5 ))
          HEAVY_J=$(( BUILD_MEM_BUDGET_GB / 10 ))
          POOL_FLAGS="-DCUTLASS_HEAVY_BUILD_JOBS=${HEAVY_J}"

          set +e
          ssh ${SSH_OPTS} ${BUILD_SERVER_USER}@${BUILD_SERVER} "
            docker run --rm --name ${CONTAINER_NAME} \
              -v ${ONEAPI_REAL_PATH}:/opt/intel/oneapi:ro \
              -v /home/${BUILD_SERVER_USER}/ci-builds/${BUILD_ID}/source:/workspace/source:ro \
              -v /shared/builds/${BUILD_ID}:/workspace/output \
              -v /home/${BUILD_SERVER_USER}/tools/bmg-ocloc:/workspace/tools/bmg-ocloc:ro \
              -v /home/${BUILD_SERVER_USER}/ci-builds/${BUILD_ID}/source/.github/docker/build.sh:/workspace/bin/build.sh:ro \
              -e DISABLE_FLASH_ATTENTION=0 \
              -e SYCL_TARGET=${{ matrix.sycl_target }} \
              -e BUILD_TARGETS=all \
              -e NINJA_JOBS=${NINJA_J} \
              -e REMOTE_BUILD_DIR=/tmp/cutlass-build-${BUILD_ID} \
              -e REMOTE_SOURCE_DIR=${{ github.workspace }} \
              -e CMAKE_EXTRA_FLAGS='-DCUTLASS_TEST_FOR_CRI=ON -DCUTLASS_ENABLE_BENCHMARKS=ON -DCUTLASS_SYCL_PROFILING_ENABLED=ON -DCUTLASS_SYCL_RUNNING_CI=ON ${POOL_FLAGS}' \
              cutlass-builder:latest
          "
          DOCKER_RC=$?
          set -e
          # docker run is synchronous: once it returns, the container has exited and
          # --rm has removed it. Disarm the orphan-kill trap — nothing left to kill,
          # and we don't want it firing on later (post-build) exit paths.
          trap - EXIT INT TERM

          if [ $DOCKER_RC -ne 0 ]; then
            # EXIT_COMPILE_ERROR (42): compilation failure from build.sh (cmake/ninja)
            # Other non-zero: infra error (SSH=255, Docker=125-127, OOM=137)
            if [ $DOCKER_RC -eq 42 ]; then
              echo "::error::Remote compilation failed (build error, exit code 42). Not falling back."
              echo "failure_type=compile" >> $GITHUB_OUTPUT
            else
              echo "::warning::Remote build infrastructure error (exit code ${DOCKER_RC})."
              echo "failure_type=infra" >> $GITHUB_OUTPUT
            fi
            exit 1
          fi

          # --- Sync results back (failure → allow fallback) ---

          if ! rsync -a -e "ssh ${SSH_OPTS}" \
            ${BUILD_SERVER_USER}@${BUILD_SERVER}:/shared/builds/${BUILD_ID}/build/ /tmp/cutlass-build-${BUILD_ID}/; then
            echo "::warning::Failed to sync build output from build server."
            echo "failure_type=infra" >> $GITHUB_OUTPUT
            exit 1
          fi

          echo "BUILD_DIR=/tmp/cutlass-build-${BUILD_ID}" >> $GITHUB_ENV
          echo "failure_type=none" >> $GITHUB_OUTPUT

      # ---- Fail fast on compilation errors (no fallback) ----
      - name: Fail on Remote Compile Error
        if: steps.build-strategy.outputs.use_remote == 'true' && steps.remote-build.outputs.failure_type == 'compile'
        shell: bash
        run: |
          echo "::error::Remote compilation failed due to a code error (not infrastructure). Review the 'Remote Build' step logs."
          exit 1

      - name: Fallback Local Build
        if: steps.build-strategy.outputs.use_remote == 'true' && steps.remote-build.outcome != 'success' && steps.remote-build.outputs.failure_type != 'compile'
        shell: bash
        run: |
          echo "::warning::Remote build failed or timed out. Falling back to local build."
          source /opt/intel/oneapi/setvars.sh --force
          export CC=icx
          export CXX=icpx
          # Disable flash attention for BMG target (build time too long, causes OOM)
          if [ "${{ matrix.sycl_target }}" = "intel_gpu_bmg_g21" ] && \
             [ -f examples/06_bmg_flash_attention/CMakeLists.txt ]; then
            cat /dev/null > examples/06_bmg_flash_attention/CMakeLists.txt
          fi
          # Limit ninja parallelism based on available RAM (~5GB per compile/link job)
          RAM_GB=$(awk '/MemTotal/{print int($2/1024/1024)}' /proc/meminfo)
          NINJA_JOBS=$(( RAM_GB / 5 ))
          [ "$NINJA_JOBS" -lt 1 ] && NINJA_JOBS=1
          [ "$NINJA_JOBS" -gt 10 ] && NINJA_JOBS=10
          [ "$NINJA_JOBS" -gt "$(nproc)" ] && NINJA_JOBS=$(nproc)
          echo "Fallback build: RAM=${RAM_GB}GB, using -j${NINJA_JOBS}"
          mkdir -p build && cd build
          cmake .. -G Ninja \
            -DCUTLASS_ENABLE_SYCL=ON \
            -DDPCPP_SYCL_TARGET=${{ matrix.sycl_target }} \
            -DCUTLASS_TEST_FOR_CRI=ON \
            -DCUTLASS_ENABLE_BENCHMARKS=ON \
            -DCUTLASS_SYCL_PROFILING_ENABLED=ON \
            -DCUTLASS_SYCL_RUNNING_CI=ON
          ninja -j${NINJA_JOBS} test/all
          ninja -j${NINJA_JOBS} examples/all
          ninja -j${NINJA_JOBS} benchmarks/all
          echo "BUILD_DIR=$(pwd)" >> $GITHUB_ENV

      # ---- Local build (for runners with enough cores) ----
      - name: Local Build
        if: steps.build-strategy.outputs.use_remote != 'true'
        shell: bash
        run: |
          source /opt/intel/oneapi/setvars.sh --force
          export CC=icx
          export CXX=icpx
          if [ "${{ matrix.sycl_target }}" = "intel_gpu_bmg_g21" ]; then
            if [ -f examples/06_bmg_flash_attention/CMakeLists.txt ]; then
              cat /dev/null > examples/06_bmg_flash_attention/CMakeLists.txt
            fi
          fi
          mkdir -p build && cd build
          cmake .. -G Ninja \
            -DCUTLASS_ENABLE_SYCL=ON \
            -DDPCPP_SYCL_TARGET=${{ matrix.sycl_target }} \
            -DCUTLASS_TEST_FOR_CRI=ON \
            -DCUTLASS_ENABLE_BENCHMARKS=ON \
            -DCUTLASS_SYCL_PROFILING_ENABLED=ON \
            -DCUTLASS_SYCL_RUNNING_CI=ON
          ninja test/all
          ninja examples/all
          ninja benchmarks/all
          echo "BUILD_DIR=$(pwd)" >> $GITHUB_ENV

      - name: Setup Virtual Environment
        shell: bash
        run: |
          source /opt/intel/oneapi/setvars.sh --force
          export ONEAPI_DEVICE_SELECTOR=level_zero:gpu
          export CMAKE_BUILD_TYPE=Release
          export IGC_VISAOptions="-perfmodel"
          export IGC_VectorAliasBBThreshold=100000000000
          export IGC_ExtraOCLOptions="-cl-intel-256-GRF-per-thread"
          export CC=icx
          export CXX=icpx
          export CUTLASS_SYCL_PROFILING_ENABLED=ON
          export LD_LIBRARY_PATH=${BUILD_DIR}/benchmarks/02_flash_attention:${BUILD_DIR}/benchmarks/02_flash_attention/legacy/flash_attention_decode:${BUILD_DIR}/deps/oneMKL/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}
          # Persist environment variables to following steps 
          env >> $GITHUB_ENV
          which $CXX
          $CXX --version
          sycl-ls

      - name: Verify Build Output
        if: steps.build-strategy.outputs.use_remote == 'true' && steps.remote-build.outcome == 'success'
        shell: bash
        run: |
          set +o pipefail
          echo "BUILD_DIR: ${BUILD_DIR}"
          echo "=== Test executables ==="
          find ${BUILD_DIR}/test -maxdepth 5 -name 'cutlass_test_unit_*' -type f 2>/dev/null | head -5
          SAMPLE=$(find ${BUILD_DIR}/test -maxdepth 5 -name 'cutlass_test_unit_*' -type f 2>/dev/null | head -1)
          set -o pipefail
          if [ -z "$SAMPLE" ]; then
            echo "::error::No test executables found in build output!"
            exit 1
          fi
          echo "=== Sample executable: $SAMPLE ==="
          file "$SAMPLE"
          ldd "$SAMPLE" 2>&1 | head -20 || true

      - name: Run Unit Tests
        shell: bash
        run: |
          cd ${BUILD_DIR}
          ctest -R test_unit --output-on-failure

      - name: Run Examples
        shell: bash
        run: |
          cd ${BUILD_DIR}
          ctest -R test_example --output-on-failure

      - name: Run Benchmarks
        shell: bash
        run: |
          cd ${BUILD_DIR}
          if [ "${{ matrix.gpu }}" = "BMG" ]; then
            ctest -R cbenchmarks --output-on-failure
          elif [ "${{ matrix.gpu }}" = "PVC" ]; then
            ctest -R cbenchmarks -E "fp8|config_file_bmg_prefill_bf16|prefill_legacy_xe_config_file_pvc" --output-on-failure
          else
            # CRI uses MACRO to control build process so we don't need to specifically exclude benchmarks here.
            ctest -R cbenchmarks --output-on-failure
          fi

      # Cleanup remote build artifacts (only needed for remote builds):
      #   Local:  rm -rf /tmp/cutlass-build-* (no-op if local fallback was used)
      #   Remote: ssh + sudo rm -rf (handles 3 scenarios):
      #     - Server unreachable: SSH times out (~30s), || true prevents job failure
      #     - Server reachable, no artifacts: rm -rf silently succeeds (~1s)
      #     - Server reachable, artifacts exist: normal cleanup (~few seconds)
      #   This only removes THIS run's own container/dirs (cutlass-build-${BUILD_ID});
      #   orphans from other runs are handled by the startup sweep above, and any
      #   residual artifacts are cleaned by the 24h auto-cleanup on the next run.
      - name: Cleanup Build Artifacts
        if: always() && steps.build-strategy.outputs.use_remote == 'true'
        shell: bash
        run: |
          if [ -n "${BUILD_ID}" ] && [[ "${BUILD_ID}" =~ ^[0-9]+-(common|small)- ]]; then
            rm -rf /tmp/cutlass-build-${BUILD_ID} || true
            ssh ${SSH_OPTS} ${BUILD_SERVER_USER}@${BUILD_SERVER} \
              "docker rm -f cutlass-build-${BUILD_ID} >/dev/null 2>&1; sudo -n rm -rf /home/${BUILD_SERVER_USER}/ci-builds/${BUILD_ID} /shared/builds/${BUILD_ID}" || true
          else
            echo "Skipping cleanup: BUILD_ID '${BUILD_ID}' is empty or does not match expected pattern"
          fi
