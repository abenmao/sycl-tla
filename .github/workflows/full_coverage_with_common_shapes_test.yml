name: "Full Coverage with Common Shapes Test"

on:
#  push:
#    branches: [ "master_next","v0.1.0_next" ]
  pull_request:
    branches: [ "master_next","v0.1.0_next" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TARGET_BRANCH: "${{ github.base_ref }}"
  CI_BUILD_ID_TAG: "common"
  # Local/fallback builds size their budget from the runner's own RAM:
  #   strong local build = RAM * LOCAL_BUILD_MEM_PCT%  (Hyperion 1003G -> ~500)
  LOCAL_BUILD_MEM_PCT: "50"
  SSH_OPTS: "-o ConnectTimeout=30 -o BatchMode=yes -o StrictHostKeyChecking=accept-new"
  REMOTE_CPU_THRESHOLD: "32"
  REMOTE_RAM_THRESHOLD: "128"

  BUILD_STEP_TIMEOUT_MIN: "120"
  ORPHAN_REAP_GRACE_MIN: "15"

jobs:
  run-tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: RELEASE
            gpu: BMG
            platform: bmg
            intel_graphics: ROLLING
            sycl_target: intel_gpu_bmg_g21
            remote_build_servers: "Atlas a4bf018cf32e.jf.intel.com support 400 400;Hermes shliclel4165.sh.intel.com support 400 400;Hyperion pvc125074.jf.intel.com support 400 400"
            runner: [self-hosted, shanghai-bmg, Linux, X64]
          - compiler: RELEASE
            gpu: PVC
            platform: pvc
            intel_graphics: ROLLING
            sycl_target: intel_gpu_pvc
            remote_build_servers: "Hyperion pvc125074.jf.intel.com support 400 400;Hermes shliclel4165.sh.intel.com support 400 400;Atlas a4bf018cf32e.jf.intel.com support 400 400"
            runner: [self-hosted, shanghai-pvc, Linux, X64]

    name: Full Coverage with Common Shapes Test on ${{ matrix.gpu }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    env:
      GPU: ${{ matrix.gpu }}
      CI_PLATFORM: ${{ matrix.platform }}
      SYCL_TARGET: ${{ matrix.sycl_target }}
      REMOTE_BUILD_SERVERS: ${{ matrix.remote_build_servers }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Check Code Changes
        id: check-changes
        env:
          FALLBACK_REASON: >-
            ${{ steps.admission.outputs.admitted != 'true' && 'No build server was admitted after capacity checks.' || steps.remote-build.outputs.failure_type == 'infra' && 'Remote build infrastructure error.' || 'Remote build did not complete with a classified result.' }}
        shell: bash
        run: bash .github/scripts/pr_ci.sh check-changes

      # ---- Auto-detect build strategy based on runner hardware ----
      - name: Detect Build Strategy
        id: build-strategy
        if: steps.check-changes.outputs.source_code_changed == 'true'
        shell: bash
        run: bash .github/scripts/pr_ci.sh detect

      # ---- Select build server + admission gate ----
      # Pick the first candidate with enough free RAM. Candidates are ordered per
      # matrix entry and use NAME HOST USER ADMISSION_GATE_GB BUILD_BUDGET_GB.
      # Re-check up to 3x, 15 min apart; if nothing is admitted, use local build.
      - name: Select Build Server
        id: admission
        if: steps.check-changes.outputs.source_code_changed == 'true' && steps.build-strategy.outputs.use_remote == 'true'
        timeout-minutes: 40
        shell: bash
        run: bash .github/scripts/pr_ci.sh select-server

      - name: Remote Build
        id: remote-build
        if: steps.check-changes.outputs.source_code_changed == 'true' && steps.build-strategy.outputs.use_remote == 'true' && steps.admission.outputs.admitted == 'true'
        continue-on-error: true
        timeout-minutes: ${{ fromJSON(env.BUILD_STEP_TIMEOUT_MIN) }}
        shell: bash
        run: bash .github/scripts/pr_ci.sh remote-build

      # ---- Fail fast on compilation errors (no fallback) ----
      - name: Fail on Remote Compile Error
        if: steps.check-changes.outputs.source_code_changed == 'true' && steps.build-strategy.outputs.use_remote == 'true' && steps.remote-build.outputs.failure_type == 'compile'
        shell: bash
        run: bash .github/scripts/pr_ci.sh fail-compile

      - name: Fallback Notice
        if: steps.check-changes.outputs.source_code_changed == 'true' && steps.build-strategy.outputs.use_remote == 'true' && steps.remote-build.outcome != 'success' && steps.remote-build.outputs.failure_type != 'compile'
        env:
          FALLBACK_REASON: >-
            ${{ steps.admission.outputs.admitted != 'true' && 'No build server was admitted after capacity checks.' || steps.remote-build.outputs.failure_type == 'infra' && 'Remote build infrastructure error.' || 'Remote build did not complete with a classified result.' }}
        shell: bash
        run: bash .github/scripts/pr_ci.sh fallback-notice

      # ---- Local build (for runners with enough cores) ----
      - name: Local Build
        if: steps.check-changes.outputs.source_code_changed == 'true' && steps.build-strategy.outputs.use_remote != 'true' || (steps.build-strategy.outputs.use_remote == 'true' && steps.remote-build.outcome != 'success' && steps.remote-build.outputs.failure_type != 'compile')
        env:
          BUILD_DISABLE_FLASH_ATTENTION: ${{ steps.build-strategy.outputs.use_remote == 'true' && '1' || '0' }}
        shell: bash
        run: bash .github/scripts/pr_ci.sh local-build

      # ---- Verify remote build output ----
      - name: Verify Build Output
        if: steps.check-changes.outputs.source_code_changed == 'true' && steps.build-strategy.outputs.use_remote == 'true' && steps.remote-build.outcome == 'success'
        shell: bash
        run: bash .github/scripts/pr_ci.sh verify-build

      # ---- Common: Run tests ----
      - name: Run Examples
        if: steps.check-changes.outputs.source_code_changed == 'true'
        shell: bash
        run: bash .github/scripts/pr_ci.sh run-example
      - name: Run Unit Tests
        if: steps.check-changes.outputs.source_code_changed == 'true'
        shell: bash
        run: bash .github/scripts/pr_ci.sh run-ut

      # ---- Common: Run benchmarks ----
      - name: Run Benchmarks
        if: steps.check-changes.outputs.source_code_changed == 'true'
        shell: bash
        run: bash .github/scripts/pr_ci.sh run-bm

      # ---- Cleanup remote build artifacts ----
      # Only runs for remote builds (gated on use_remote == 'true').
      #   Local:  rm -rf /tmp/cutlass-build-* (cleans synced build output)
      #   Remote: ssh + sudo rm -rf (handles 3 scenarios):
      #     - Server unreachable: SSH times out (~30s), || true prevents job failure
      #     - Server reachable, no artifacts: rm -rf silently succeeds (~1s)
      #     - Server reachable, artifacts exist: normal cleanup (~few seconds)
      #   This only removes THIS run's own container/dirs (cutlass-build-${BUILD_ID});
      #   orphans from other runs are handled by the startup sweep above, and any
      #   residual artifacts are cleaned by the 24h auto-cleanup on the next run.
      - name: Cleanup Build Artifacts
        if: always() && steps.build-strategy.outputs.use_remote == 'true'
        shell: bash
        run: bash .github/scripts/pr_ci.sh cleanup
